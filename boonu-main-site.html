<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play Hub – Fun Little Games</title>
<meta name="description" content="A small collection of fun browser games. Pick one and play.">
<style>
  :root{
    --bg:#0f1020; --card:#1a1b33; --card2:#22234a; --text:#f4f4fb; --muted:#a6a8c8;
    --accent:#ffb347; --accent2:#ff6b6b; --radius:20px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(circle at 20% 0%,#2a2b5e 0,transparent 45%),
               radial-gradient(circle at 90% 100%,#4a1f4f 0,transparent 40%),var(--bg);
    color:var(--text);min-height:100vh;line-height:1.5;
  }
  .wrap{max-width:1000px;margin:0 auto;padding:0 20px}
  header{padding:56px 0 28px;text-align:center}
  .logo{font-size:44px}
  h1{font-size:clamp(30px,6vw,52px);letter-spacing:-1px;margin-top:6px}
  h1 span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--muted);margin-top:10px;font-size:18px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;padding:28px 0 40px}
  .card{
    background:linear-gradient(160deg,var(--card2),var(--card));
    border:1px solid rgba(255,255,255,.08);border-radius:var(--radius);
    padding:26px;display:flex;flex-direction:column;gap:12px;
    text-decoration:none;color:inherit;
    transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
  }
  .card:hover,.card:focus-visible{transform:translateY(-6px);box-shadow:0 18px 40px rgba(0,0,0,.45);border-color:var(--accent);outline:none}
  .icon{font-size:48px;width:76px;height:76px;display:grid;place-items:center;border-radius:18px;background:rgba(255,255,255,.07)}
  .card h2{font-size:24px}
  .card p{color:var(--muted);flex:1}
  .tag{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--accent)}
  .play{
    margin-top:6px;align-self:flex-start;padding:10px 20px;border-radius:999px;font-weight:700;
    background:linear-gradient(90deg,var(--accent),var(--accent2));color:#1a1020;
  }
  .coffee{text-align:center;padding:10px 0 50px}
  .coffee a{
    display:inline-block;padding:12px 22px;border-radius:999px;font-weight:600;text-decoration:none;
    color:var(--text);border:1px dashed var(--accent);transition:background .2s;
  }
  .coffee a:hover{background:rgba(255,179,71,.12)}
  footer{text-align:center;color:var(--muted);font-size:14px;padding:0 0 36px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🎮</div>
    <h1>Play <span>Hub</span></h1>
    <p class="sub">A few small games, made for fun. Pick one and start playing.</p>
  </header>

  <main class="grid" id="games" aria-label="Games"></main>

  <div class="coffee">
    <!-- Replace with your Buy Me a Coffee link -->
    <a href="https://buymeacoffee.com/YOUR_NAME" target="_blank" rel="noopener">☕ Enjoying the games? Buy me a coffee</a>
  </div>

  <footer>Made by <span id="author">Biraj</span> · <span id="year"></span></footer>
</div>

<script>
  // ✏️ EDIT THIS LIST — add, remove or change games here. Nothing else needs touching.
  const GAMES = [
    {
      name: "GuessWisely",
      emoji: "🧠",
      tag: "Guessing game",
      desc: "Think carefully, guess smart, and see how few tries you need.",
      url: "https://guesswisely.onrender.com"
    },
    {
      name: "WordFox",
      emoji: "🦊",
      tag: "Word game",
      desc: "Outsmart the fox by finding the right words.",
      url: "https://wordfox-sxpx.onrender.com"
    },
    {
      name: "Sketchy",
      emoji: "🎨",
      tag: "Drawing game",
      desc: "Draw, doodle and have a laugh with friends.",
      url: "http://sketchy-ked0.onrender.com/"
    }
  ];

  const grid = document.getElementById("games");
  GAMES.forEach(g => {
    const a = document.createElement("a");
    a.className = "card";
    a.href = g.url;
    a.setAttribute("aria-label", "Play " + g.name);
    a.innerHTML =
      '<div class="icon">' + g.emoji + '</div>' +
      '<span class="tag">' + g.tag + '</span>' +
      '<h2>' + g.name + '</h2>' +
      '<p>' + g.desc + '</p>' +
      '<span class="play">Play now →</span>';
    grid.appendChild(a);
  });
  document.getElementById("year").textContent = new Date().getFullYear();
</script>
</body>
</html>
